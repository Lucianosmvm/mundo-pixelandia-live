name: Copiar icones originais
on:
  push:
    paths:
      - '.github/workflows/copiar-icones.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar icones da versao original
        run: |
          curl -fL --retry 3 -o icon-192.png https://raw.githubusercontent.com/Lucianosmvm/mundo-pixelandia/main/icon-192.png
          curl -fL --retry 3 -o icon-512.png https://raw.githubusercontent.com/Lucianosmvm/mundo-pixelandia/main/icon-512.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: copiar icones originais da Pixelandia"
            git push
          fi
